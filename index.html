<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeApp</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="header-logo" href="#inicio" aria-label="Ir al inicio">
        <img src="./assets/img/logo-pokemon.svg" alt="Pokémon" />
      </a>

      <nav class="header-nav" aria-label="Secciones de PokeApp">
        <a href="#inicio" id="link-inicio">Inicio</a>
        <a href="#" id="link-pokedex">Pokédex</a>
        <a href="#" id="link-login">Usuario</a>
        <a href="#" id="link-carga" hidden>Cargar Pokémon</a>
        <a href="#" id="link-juego">Batalla</a>
      </nav>

      <form class="header-search" id="form-busqueda">
        <input type="search" id="busqueda" aria-label="Buscar Pokémon por nombre, número o tipo" placeholder="Buscar Pokémon..." />

        <button type="submit" aria-label="Buscar">🔍</button>
      </form>
    </header>
    <main class="main">
      <div id="app"></div>
    </main>

    <footer class="footer">
      <p>Pokédex Web - Proyecto educativo</p>

      <p>Proyecto basado en <a href="https://github.com/totoargumedo/PokeApp">totoargumedo/PokeApp</a></p>
    </footer>

    <script type="module" src="./js/app.js"></script>


  </body>
</html>
